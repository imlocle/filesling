name: Build & Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymobiledevice3
          pip install pyinstaller pillow

      - name: Build .app with PyInstaller
        run: |
          pyinstaller \
            --name=FileSling \
            --windowed \
            --icon=assets/icons/filesling_logo.png \
            --add-data="assets:assets" \
            --hidden-import=paramiko \
            --hidden-import=pydantic \
            --hidden-import=PySide6 \
            --hidden-import=pymobiledevice3 \
            main.py

      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          cp -R dist/FileSling.app dmg_contents/
          ln -s /Applications dmg_contents/Applications
          hdiutil create -volname "FileSling" -srcfolder dmg_contents -ov -format UDZO FileSling.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: FileSling.dmg

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install keyring pyinstaller pillow

      - name: Generate Windows icon
        run: python scripts/generate_icons.py

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller --name=FileSling --windowed --icon=assets/icons/generated/FileSling.ico --add-data="assets;assets" --hidden-import=paramiko --hidden-import=pydantic --hidden-import=PySide6 --hidden-import=keyring main.py

      - name: Zip Windows build
        run: Compress-Archive -Path dist/FileSling/* -DestinationPath FileSling-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-zip
          path: FileSling-Windows.zip

  release:
    needs: [build-python, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v5
        with:
          name: macos-dmg
          path: macos/

      - uses: actions/download-artifact@v5
        with:
          name: windows-zip
          path: windows/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            macos/FileSling.dmg
            windows/FileSling-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
